# Shared security headers. Included per-server AND per-location because any
# add_header inside a location cancels inherited ones (nginx quirk).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# the finder listens through the microphone on this origin only; no camera, no location
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Strict CSP: scripts and the WebAssembly speech runtime from this origin only (no CDN, no
# inline script); the map's basemap tiles from Esri; audio clips from blobs. No analytics.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self'; media-src 'self' blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
