server {
    listen 80;
    listen [::]:80;
    server_name geo-health.nexasee.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name geo-health.nexasee.com;

    # Cloudflare Origin CA certificate (SSL mode "Full (strict)").
    # Generate in Cloudflare > SSL/TLS > Origin Server and place in deploy/certs/.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # versioned datasets: cache forever, bump the _vN suffix to invalidate
    location /data/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types {
            application/gzip gz;
            application/json json;
            application/geo+json geojson;
        }
    }

    # hashed build assets: cache forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # the offline facility finder: /finder is the page, and the files it side-loads
    # (speech model, ONNX runtime, voice clips) cache forever like the datasets
    location = /finder {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /finder.html =404;
    }
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location ~ ^/(models|ort|voice)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types {
            application/wasm wasm;
            application/octet-stream onnx;
            text/javascript mjs;
            application/json json;
            audio/wav wav;
        }
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html /index.html;
    }
}
